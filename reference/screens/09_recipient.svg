<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844"><rect width="390" height="844" fill="white" /><text x="16" y="35" fill="#222222" font-family="DejaVu Sans" font-size="22" font-weight="700">Получатель</text><g transform="translate(346 15) scale(0.9166666666666666)" fill="none" stroke="#222222" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="4" cy="12" r="1" /><circle cx="12" cy="12" r="1" /><circle cx="20" cy="12" r="1" /></g><text x="16" y="62" fill="#717171" font-family="DejaVu Sans" font-size="14" font-weight="400">Европочта · доставка в отделение</text><text x="16" y="87" fill="#222222" font-family="DejaVu Sans" font-size="14" font-weight="700">Фамилия</text><rect x="16" y="101" width="358" height="56" rx="12" fill="white" stroke="#DDDDDD" /><text x="32" y="136" fill="#222222" font-family="DejaVu Sans" font-size="16" font-weight="400">Ковалёва</text><text x="16" y="183" fill="#222222" font-family="DejaVu Sans" font-size="14" font-weight="700">Имя</text><rect x="16" y="197" width="358" height="56" rx="12" fill="white" stroke="#DDDDDD" /><text x="32" y="232" fill="#222222" font-family="DejaVu Sans" font-size="16" font-weight="400">Анна</text><text x="16" y="279" fill="#222222" font-family="DejaVu Sans" font-size="14" font-weight="700">Телефон</text><rect x="16" y="293" width="358" height="56" rx="12" fill="white" stroke="#DDDDDD" /><text x="32" y="328" fill="#717171" font-family="DejaVu Sans" font-size="16" font-weight="400">+375 · введите номер</text><text x="16" y="394" fill="#222222" font-family="DejaVu Sans" font-size="14" font-weight="700">Поделиться телефоном из Telegram</text><path d="M16 419 H374" stroke="#DDDDDD" /><text x="16" y="451" fill="#222222" font-family="DejaVu Sans" font-size="18" font-weight="700">Выбранное отделение</text><text x="16" y="479" fill="#717171" font-family="DejaVu Sans" font-size="14" font-weight="400">Минск · номер и адрес отделения</text><text x="16" y="500" fill